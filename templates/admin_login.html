<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login | Visitor Helper Desk</title><style>body{font-family:system-ui;background:#f4f6fa;margin:0;display:grid;min-height:100vh;place-items:center}.card{background:white;padding:32px;border-radius:20px;max-width:420px;width:calc(100% - 36px);box-shadow:0 12px 40px #0001}h1{margin:0 0 8px}label{display:block;margin:18px 0 8px;font-weight:700}input,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d8deea;border-radius:10px;font:inherit}button{margin-top:18px;color:white;background:linear-gradient(90deg,#ef1010,#fa811d);border:0;font-weight:700;cursor:pointer}.err{color:#c00}</style></head><body><form class="card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><h1>Visitor Helper Desk</h1><p>Admin access</p><label for="password">Admin password</label><input id="password" name="password" type="password" required autocomplete="current-password"><button type="submit">Sign in</button><p class="err">{{ error }}</p></form></body></html>
